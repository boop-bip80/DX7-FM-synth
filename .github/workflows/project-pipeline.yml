name: DX7 builds - Linux, Windows and macOS

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dx7-build-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  component_version:
    name: Compute build identity
    runs-on: ubuntu-22.04
    outputs:
      build_version: ${{ steps.vers.outputs.build_version }}
    steps:
      - name: Select release or rolling UI preview version
        id: vers
        run: |
          if [[ "$GITHUB_REF_TYPE" == 'tag' ]]; then
            echo "build_version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            # Stable filenames let UI-Nightly replace obsolete binaries.
            echo 'build_version=UI_NIGHTLY' >> "$GITHUB_OUTPUT"
          fi

  build-linux:
    name: Linux standalone, VST3 and CLAP
    runs-on: ubuntu-22.04
    needs: component_version
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install JUCE build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libx11-dev libxinerama-dev libxext-dev \
            libfreetype6-dev libwebkit2gtk-4.1-dev libglu1-mesa-dev \
            libgtk-3-dev libjack-jackd2-dev libsndfile1-dev xvfb
      - name: Configure and package
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_ID='${{ needs.component_version.outputs.build_version }}' \
            -DJUCE_COPY_PLUGIN_AFTER_BUILD=FALSE
          cmake --build build --config Release --target installer --parallel 3
      - name: Verify archives
        run: |
          compgen -G 'build/installer/*.zip' > /dev/null
          ls -lh build/installer/
      - uses: actions/upload-artifact@v4
        with:
          name: linux-bin
          path: build/installer/*
          if-no-files-found: error
          retention-days: 90

  build-windows:
    name: Windows standalone, VST3 and CLAP
    runs-on: windows-2022
    needs: component_version
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure and package
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_ID='${{ needs.component_version.outputs.build_version }}' \
            -DJUCE_COPY_PLUGIN_AFTER_BUILD=FALSE
          cmake --build build --config Release --target installer --parallel 3
      - name: Verify archives
        run: |
          compgen -G 'build/installer/*.zip' > /dev/null
          ls -lh build/installer/
      - uses: actions/upload-artifact@v4
        with:
          name: windows-bin
          path: build/installer/*
          if-no-files-found: error
          retention-days: 90

  build-macos:
    name: macOS standalone, VST3, AU and CLAP
    runs-on: macos-14
    needs: component_version
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Detect optional signing credentials
        id: signing
        env:
          MAC_CERTS_P12: ${{ secrets.MAC_CERTS_P12 }}
        run: |
          if [[ -n "$MAC_CERTS_P12" ]]; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Publishing an unsigned macOS preview; no certificate is configured.'
          fi
      - name: Import certificate if configured
        if: steps.signing.outputs.available == 'true'
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.MAC_CERTS_P12 }}
          p12-password: ${{ secrets.MAC_CERT_PWD }}
      - name: Configure and package
        env:
          MAC_SIGNING_CERT: ${{ secrets.MAC_SIGNING_CERT }}
          MAC_INSTALLING_CERT: ${{ secrets.MAC_INSTALLING_CERT }}
          MAC_SIGNING_ID: ${{ secrets.MAC_SIGNING_ID }}
          MAC_TEAM_ID: ${{ secrets.MAC_TEAM_ID }}
          MAC_TEAM_PASSWORD: ${{ secrets.MAC_TEAM_PASSWORD }}
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_ID='${{ needs.component_version.outputs.build_version }}' \
            -DJUCE_COPY_PLUGIN_AFTER_BUILD=FALSE
          cmake --build build --config Release --target installer --parallel 3
      - name: Verify archives
        run: |
          compgen -G 'build/installer/*.zip' > /dev/null
          ls -lh build/installer/
      - uses: actions/upload-artifact@v4
        with:
          name: macos-bin
          path: build/installer/*
          if-no-files-found: error
          retention-days: 90

  publish-nightly:
    name: Refresh UI-Nightly release with validated builds
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-22.04
    needs: [build-linux, build-windows, build-macos]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-bin'
          path: release-assets
          merge-multiple: true
      - name: Update rolling release and attach downloads
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Ship the 80s LA Studio voice library (32 DX7 cartridges) as its own download next to the builds.
          if [[ -d presets/80s-LA-Studio ]]; then
            mkdir -p release-assets
            (cd presets && zip -qr -9 ../release-assets/DX7-80s-LA-Studio-Presets.zip 80s-LA-Studio)
            unzip -l release-assets/DX7-80s-LA-Studio-Presets.zip | tail -1
          fi
          mapfile -d '' files < <(find release-assets -type f \( -name '*.zip' -o -name '*.dmg' -o -name '*.exe' \) -print0)
          (( ${#files[@]} > 0 )) || { echo 'No package files' >&2; exit 1; }
          # UI-Nightly is intentionally movable; versioned v* tags are not.
          git tag -f UI-Nightly "$GITHUB_SHA"
          git push --force origin refs/tags/UI-Nightly
          if ! gh release view UI-Nightly >/dev/null 2>&1; then
            gh release create UI-Nightly --title 'DX7 FM Synth - UI Nightly' \
              --notes 'Automated preview after all three OS builds succeed. macOS binaries may be unsigned.' \
              --prerelease --latest=false
          fi
          gh release upload UI-Nightly "${files[@]}" --clobber
          gh release edit UI-Nightly \
            --notes "Built from ${GITHUB_SHA}. Check [workflow results](https://github.com/${GITHUB_REPOSITORY}/actions/workflows/project-pipeline.yml). DX7-80s-LA-Studio-Presets.zip holds the 1,024-voice 80s LA Studio library (32 DX7 cartridges). The live screenshot is produced separately by ui-preview.yml."

  publish-release:
    name: Publish immutable versioned release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    needs: [build-linux, build-windows, build-macos]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-bin'
          path: release-assets
          merge-multiple: true
      - name: Attach verified builds to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mapfile -d '' files < <(find release-assets -type f \( -name '*.zip' -o -name '*.dmg' -o -name '*.exe' \) -print0)
          (( ${#files[@]} > 0 )) || { echo 'No package files' >&2; exit 1; }
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
